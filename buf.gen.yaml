# Generates the plugin contract's code from proto/ with local generators only: nothing is fetched from a
# registry. The versions are pinned in gen/go/go.mod (Go) and gen/requirements.txt (Python); see gen/README.md.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/practice-library/machinery/gen/go
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: module=github.com/practice-library/machinery/gen/go
  - local: protoc-gen-connect-go
    out: gen/go
    opt: module=github.com/practice-library/machinery/gen/go
  - local: protoc-gen-py
    out: gen/python/src
  - local: protoc-gen-connectrpc
    out: gen/python/src
