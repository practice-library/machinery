# The consumer template of practice-library/.github: Dependabot proposes new pins for the reusable
# workflows and actions used here, for the hash-pinned requirements.txt, and for the generators in gen/
# (a generator bump changes the generated code, so CI fails until it is regenerated in the same pull request).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /gen
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /gen/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
