# The consumer template of practice-library/.github: Dependabot proposes new pins for the reusable
# workflows and actions used here, and for the hash-pinned requirements.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
