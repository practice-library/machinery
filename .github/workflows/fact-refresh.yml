name: fact-refresh
# Re-reads the source of every due fact in practice-library/graphs and uploads one report per graph as the
# artifact refresh-report (spec/refresh-report of that repository). It holds no secret and pushes nothing:
# the opener, run by a maintainer as the organisation's app, turns reports into pull requests (README.md).
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit of practice-library/graphs to read
        type: string
        default: main
permissions: {}
concurrency:
  group: fact-refresh
  cancel-in-progress: false
jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: practice-library/graphs
          ref: ${{ inputs.ref || 'main' }}
          path: graphs
          persist-credentials: false
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$TOOL_URL" -o "$RUNNER_TEMP/jsonschema.zip"
          echo "$TOOL_SHA256  $RUNNER_TEMP/jsonschema.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jsonschema.zip" -d "$RUNNER_TEMP/jsonschema"
          echo "$RUNNER_TEMP/jsonschema/jsonschema-17.2.1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install requirements.txt, pinned by hash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Refresh every graph
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m factrefresh refresh --graphs graphs --out reports --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL"
      - name: Every report matches spec/refresh-report of the checkout
        run: |
          set -euo pipefail
          find reports -name '*.json' -print0 | sort -z | xargs -0 -n1 jsonschema validate graphs/spec/refresh-report/schema.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-report
          path: reports/
          if-no-files-found: error
          retention-days: 90

  heartbeat:
    # GitHub disables the schedule of a public repository after 60 days without activity. Each scheduled run
    # re-enables its own workflow through the API, so the schedule does not depend on commits here.
    if: github.event_name == 'schedule'
    name: heartbeat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/fact-refresh.yml/enable"
