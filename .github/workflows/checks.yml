name: checks
# Every check a pull request must pass; the ruleset requires "gate / gate". Reusable workflows come from
# practice-library/.github, pinned to the full commit of release v1.1.0. The gate's needs must equal the
# jobs in .github/required-checks.json.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests on recorded fixtures, with the network refused
        run: python3 -m unittest discover -s tests -t . -v
      - name: Each guard, removed, makes its test fail
        run: python3 tests/guards.py
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$TOOL_URL" -o "$RUNNER_TEMP/jsonschema.zip"
          echo "$TOOL_SHA256  $RUNNER_TEMP/jsonschema.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jsonschema.zip" -d "$RUNNER_TEMP/jsonschema"
          echo "$RUNNER_TEMP/jsonschema/jsonschema-17.2.1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: The recorded report matches spec/refresh-report
        run: jsonschema validate tests/fixtures/graphs/spec/refresh-report/schema.json tests/fixtures/expect/vendors-example.json

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The report schema pin, the one data row in contract/pins.json
        id: pin
        run: |
          set -euo pipefail
          {
            echo "repository=$(jq -r '.refreshReport.repository' contract/pins.json)"
            echo "ref=$(jq -r '.refreshReport.tag // .refreshReport.commit' contract/pins.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: pinned
          persist-credentials: false
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$TOOL_URL" -o "$RUNNER_TEMP/jsonschema.zip"
          echo "$TOOL_SHA256  $RUNNER_TEMP/jsonschema.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jsonschema.zip" -d "$RUNNER_TEMP/jsonschema"
          echo "$RUNNER_TEMP/jsonschema/jsonschema-17.2.1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: The pinned schema is the one the contract references by $id
        run: |
          set -euo pipefail
          schema="pinned/$(jq -r '.refreshReport.path' contract/pins.json)"
          test "$(jq -r '."$id"' "$schema")" = "$(jq -r '.refreshReport.id' contract/pins.json)"
          echo "REPORT_SCHEMA=$schema" >> "$GITHUB_ENV"
      - name: The contract schemas are valid JSON Schema 2020-12
        run: for f in contract/v0/*.json; do jsonschema metaschema "$f"; done
      - name: Every schema example validates, every counter-example is rejected
        run: python3 contract/check_examples.py --validator jsonschema --report-schema "$REPORT_SCHEMA"
      - name: The Python plugin passes the conformance suite
        run: python3 conformance/run.py --plugin "$PWD/bin/fact-refresh-plugin" --report-schema "$REPORT_SCHEMA" --validator jsonschema

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@f5dc7203e3a718e891bbfdc6833226721e1da3e1 # v1.1.0

  gate:
    if: always()
    needs: [unit, conformance, leak-scan]
    uses: practice-library/.github/.github/workflows/gate.yml@f5dc7203e3a718e891bbfdc6833226721e1da3e1 # v1.1.0
    with:
      needs: ${{ toJSON(needs) }}
