name: checks
# Every check a pull request must pass; the ruleset requires "gate / gate". Reusable workflows come from
# practice-library/.github, pinned to the full commit of release v2.4.0. The gate's needs must equal the
# jobs in .github/required-checks.json.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install requirements.txt, pinned by hash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Unit tests on recorded fixtures, with the network refused
        run: python3 -m unittest discover -s tests -t . -v
      - name: Each guard, removed, makes its test fail
        run: python3 tests/guards.py

  contract-schemas:
    uses: practice-library/.github/.github/workflows/schema-check.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      mode: metaschema
      schema: contract/v0

  recorded-report:
    uses: practice-library/.github/.github/workflows/schema-check.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      schema: tests/fixtures/graphs/spec/refresh-report/schema.json
      instances: tests/fixtures/expect/vendors-example.json
      resolve: tests/fixtures/graphs/spec/refresh-report/schema.json
      resolve-ids: https://github.com/practice-library/.github/spec/refresh-report/schema.json

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The report schema pin, the one data row in contract/pins.json
        id: pin
        run: |
          set -euo pipefail
          {
            echo "repository=$(jq -r '.refreshReport.repository' contract/pins.json)"
            echo "ref=$(jq -r '.refreshReport.commit' contract/pins.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: pinned
          persist-credentials: false
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$TOOL_URL" -o "$RUNNER_TEMP/jsonschema.zip"
          echo "$TOOL_SHA256  $RUNNER_TEMP/jsonschema.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jsonschema.zip" -d "$RUNNER_TEMP/jsonschema"
          echo "$RUNNER_TEMP/jsonschema/jsonschema-17.2.1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: The pinned schema is the one the contract references by $id, and the tests' copy equals it
        run: |
          set -euo pipefail
          schema="pinned/$(jq -r '.refreshReport.path' contract/pins.json)"
          test "$(jq -r '."$id"' "$schema")" = "$(jq -r '.refreshReport.id' contract/pins.json)"
          cmp "$schema" tests/fixtures/graphs/spec/refresh-report/schema.json
          repo="$(jq -r '.refreshReport.repository' contract/pins.json)"
          tag="$(jq -r '.refreshReport.tag' contract/pins.json)"
          commit="$(jq -r '.refreshReport.commit' contract/pins.json)"
          # the tag must name the pinned commit (an annotated tag through its peeled ^{} line)
          named="$(git ls-remote "https://github.com/$repo" "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | awk 'END {print $1}')"
          test "$named" = "$commit" || { echo "::error file=contract/pins.json::tag $tag names $named, not $commit"; exit 1; }
          echo "REPORT_SCHEMA=$schema" >> "$GITHUB_ENV"
      - name: Every schema example validates, every counter-example is rejected
        run: python3 contract/check_examples.py --validator jsonschema --report-schema "$REPORT_SCHEMA"
      - name: The Python plugin passes the conformance suite
        run: python3 conformance/run.py --plugin "$PWD/bin/fact-refresh-plugin" --report-schema "$REPORT_SCHEMA" --validator jsonschema

  proto:
    name: proto
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch buf 1.75.0, pinned by sha256
        env:
          TOOL_URL: https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64.tar.gz
          TOOL_SHA256: 7168a06e29bd5eb8d1530848f242264f7a86b9b8af3b2e811570fbea0c929a30
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$TOOL_URL" -o "$RUNNER_TEMP/buf.tar.gz"
          echo "$TOOL_SHA256  $RUNNER_TEMP/buf.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/buf"
          tar -xzf "$RUNNER_TEMP/buf.tar.gz" -C "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP/buf/buf/bin" >> "$GITHUB_PATH"
      - name: The .proto is formatted, passes lint STANDARD, and builds
        run: |
          set -euo pipefail
          buf format -d --exit-code
          buf lint
          buf build --exclude-imports -o "$RUNNER_TEMP/image.json"
      - name: Every call takes caps first and replies with exactly the envelope fields
        run: jq -r -f proto/check.jq "$RUNNER_TEMP/image.json"

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0

  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      guard: denylist

  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      guard: removed-paths

  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      guard: release-note

  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      guard: schema-loosening

  gate:
    if: always()
    needs: [unit, contract-schemas, recorded-report, conformance, proto, leak-scan, denylist, removed-paths, release-note, schema-loosening]
    uses: practice-library/.github/.github/workflows/gate.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      needs: ${{ toJSON(needs) }}
